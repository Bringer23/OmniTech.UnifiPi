---
services:

  unifi-network-application:
    image: lscr.io/linuxserver/unifi-network-application:10.3.55
    ports:
      - 8443:8443
      - 3478:3478/udp
      - 10001:10001/udp
      - 8080:8080
      - 1900:1900/udp
      - 8843:8843
      - 8880:8880
      - 6789:6789
      - 5514:5514/udp
    restart: unless-stopped
    env_file: secrets.env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MONGO_HOST=unifi-mongo
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifidb
      - MEM_LIMIT=1024
      - MEM_STARTUP=1024
    volumes:
      - /docker/data/unifi:/config
    depends_on:
      - unifi-mongo
    networks:
      - unifi-net

  unifi-mongo:
    image: mongo:8.2.7
    restart: always
    env_file: secrets.env
    environment:
      MONGO_INITDB_DATABASE: unifidb
    volumes:
      - /docker/data/mongo:/data/db
      - /docker/compose/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    networks:
      - unifi-net

networks:
  unifi-net:
    driver: bridge
